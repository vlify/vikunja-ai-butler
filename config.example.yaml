# ==============================================================================
# Vikunja AI Butler — Main Configuration
# ==============================================================================

timezone: "Asia/Shanghai" # IANA timezone for daily digest cutoff and display

# Vikunja Connection
vikunja:
  # Base URL to Vikunja instance (defaults to VIKUNJA_URL from environment)
  # url: "https://vikunja.example.com"
  # API Token (recommended to set via VIKUNJA_TOKEN in .env for security)
  # token: "your_token_here"
  timeout_seconds: 30

# GTD Project Mapping & Classification Whitelist
gtd:
  # The source inbox project ID to process
  inbox_project_id: 1

  # Whitelist of allowed target projects for AI classification.
  # Fail-closed rule: Any suggestion outside this dictionary is rejected immediately.
  allowed_target_projects:
    5: "Single Action"
    6: "Project"
    7: "Waiting For"

  # Projects strictly forbidden as classification targets (defensive fail-closed guard)
  forbidden_target_projects:
    - 1 # Inbox itself
    - 8 # Someday / Maybe

  # Digest display configuration: list of project IDs to include in the pending section,
  # in the exact display order desired.
  digest_project_order:
    - 1 # Inbox
    - 5 # Single Action
    - 6 # Project
    - 7 # Waiting For

# LLM Classification & Insight Provider
llm:
  provider: openai-compat      # 或 cli
  base_url: http://127.0.0.1:4000/v1
  model: glm                   # 网关任一 model_name
  api_key_env: LLM_GATEWAY_KEY
  timeout_seconds: 240
  # provider: cli 时
  # command: ["agy-run.sh"]    # argv 列表,stdin 喂 prompt

# ActivityWatch Screen Time Integration (Optional)
activitywatch:
  enabled: false # Set to true to include screen time summary in evening digest
  client_bin: "aw-client"
  # Directory containing app-breakdown.txt and title-breakdown.txt queries
  queries_dir: "/path/to/aw-client/queries"
  # Optional shell execution wrapper template (e.g. "fish -c '{cmd}'" or "" for direct invocation)
  shell_command: ""
  # Background / idle applications to exclude from active screen time (comma-separated or list)
  background_apps:
    - "cs2"
    - "steam"
    - "screensaver"

# Notification Delivery (Optional)
notifier:
  # Notification channel: "none" (prints to stdout/backup file) | "himalaya" (CLI mail sender)
  type: "none"
  account: "default"
  from: "butler@example.com"
  to: "user@example.com"
  # bin: "himalaya" # Optional custom binary path

# Local backup and logging
backup:
  enabled: true
  file_path: "" # 留空默认使用 tempfile.mkstemp 生成 0600 安全临时文件；亦可填写具体绝对路径覆盖

# Morning News and Task Reconciliation (Morning Brief)
morning:
  enabled: true
  # Matrix Notification Delivery
  matrix:
    homeserver_url: "" # 留空不发；如使用 Matrix 需配置为 https://matrix.org 或私有 homeserver
    room_id: "" # 留空不发 (fail-closed)；需配置为目标房间 ID
    # Access token MUST come from environment (MATRIX_HOMESERVER_TOKEN) or .env for security.
    # token: "your_matrix_access_token"
  # GitHub Notifications Source (0 token)
  github:
    enabled: true
    gh_bin: "/usr/bin/gh"
  # Gmail Himalaya Source (0 token)
  gmail:
    enabled: true
    himalaya_bin: "himalaya"
    account: "gmail"
  # Destination Vikunja Project ID for actionable tasks (default: 1 for Inbox)
  target_project_id: 1
